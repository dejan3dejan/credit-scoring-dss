name: e2e

on:
  push:
  pull_request:

jobs:
  react:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: docker compose -p cs-e2e -f docker-compose.yml -f e2e/compose.e2e.yml up --build --detach --wait
      - run: curl --fail --silent --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8081/app/ | grep --quiet '<div id="root">'
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      - if: failure()
        run: docker compose -p cs-e2e -f docker-compose.yml -f e2e/compose.e2e.yml logs
      - if: always()
        run: docker compose -p cs-e2e -f docker-compose.yml -f e2e/compose.e2e.yml down -v
